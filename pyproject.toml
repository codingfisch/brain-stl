[tool.poetry]
name = 'brain-stl'
version = '0.0.2'
description = 'Turn your brain MRI into a printable 3D model in seconds 🧠➡️🖨️'
authors = ['codingfisch <codingfisch@gmail.com>']
license = 'MIT'
readme = 'README.md'
repository = 'https://github.com/codingfisch/brain-stl'
classifiers = [
    'Programming Language :: Python :: 3',
    'Operating System :: OS Independent',
    'Intended Audience :: Science/Research'
]

[tool.poetry.dependencies]
python = '^3.9'
niftiview = '<2'
colorbar = '>=0.2.1'  # 0.2.0 breaks on pillow>=13
deepmriprep = '*'
trimesh = '*'
dcm2niix = '>=1.0.20250506'
PyMCubes = '*'
fast_simplification = '>=0.1.9'

[tool.poetry.scripts]
brain-stl = 'brain_stl.cli:run_cli'

[build-system]
requires = ['poetry-core']
build-backend = 'poetry.core.masonry.api'
